# The embedded rescue parser does not interpret shell conditionals.
insmod iso9660
insmod search
insmod search_fs_file
insmod configfile
set root=
search --no-floppy --file /reliefos-installer-iso.marker --set=root
configfile ($root)/grub/grub.cfg
# Compatibility for older media; reached only if the first menu returns/fails.
search --no-floppy --file /leonos-installer-iso.marker --set=root
configfile ($root)/grub/grub.cfg
