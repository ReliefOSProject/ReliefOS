# The embedded rescue parser does not interpret shell conditionals.
insmod iso9660
insmod search
insmod search_fs_file
insmod configfile
insmod regexp
regexp --set=1:reliefos_boot_device '^\(([^)]+)\)' "$cmdpath"
set root="$reliefos_boot_device"
configfile ($root)/grub/grub.cfg
set root=
search --no-floppy --file /@RELIEFOS_ISO_MARKER@ --set=root
configfile ($root)/grub/grub.cfg
