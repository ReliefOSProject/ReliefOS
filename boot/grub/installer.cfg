set timeout=5
set default=0
insmod serial
insmod terminal
insmod part_gpt
insmod fat
insmod iso9660
insmod multiboot2
insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
if ! search --no-floppy --file /reliefos-installer-iso.marker --set=root; then
    search --no-floppy --file /leonos-installer-iso.marker --set=root
fi
if [ -f ($root)/grub/fonts/leonos-unicode.pf2 ]; then
    loadfont ($root)/grub/fonts/leonos-unicode.pf2
fi
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm
set theme=($root)/grub/theme/theme.txt
export theme

menuentry "Install ReliefOS" {
    multiboot2 /reliefos/kernel.sys root=/ log=screen,serial bootlog=1 mode=installer
    module2 /install/root.fat reliefos-installer-root
    boot
}

menuentry "Install ReliefOS (console session)" {
    multiboot2 /reliefos/kernel.sys root=/ log=screen,serial mode=installer installer-session=tui
    module2 /install/root.fat reliefos-installer-root
    boot
}

menuentry "Install ReliefOS (Enable boot log screen)" {
    multiboot2 /reliefos/kernel.sys root=/ log=screen,serial bootlog=1 bootlog-pause=1 mode=installer
    module2 /install/root.fat reliefos-installer-root
    boot
}

menuentry "Install ReliefOS (debug log)" {
    multiboot2 /reliefos/kernel.sys root=/ log=screen,serial bootlog=1 debug=1 mode=installer
    module2 /install/root.fat reliefos-installer-root
    boot
}

menuentry "Reboot" {
    reboot
}
