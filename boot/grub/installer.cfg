set timeout=5
set default=0
insmod serial
insmod terminal
insmod part_gpt
insmod fat
insmod iso9660
insmod multiboot2
insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
if [ -f ($root)/grub/fonts/leonos-unicode.pf2 ]; then
    loadfont ($root)/grub/fonts/leonos-unicode.pf2
fi
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=1920x1080,1280x800,1024x768,auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm
set theme=($root)/grub/theme/theme.txt
export theme

function reliefos_install {
    if ! multiboot2 /reliefos/kernel.sys root=/ log=screen,serial mode=installer $1; then
        return 1
    fi
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    if module2 /reliefos/initramfs.cpio initramfs; then
        if module2 /install/root.fat reliefos-installer-root; then
            boot
            return
        fi
    fi
    # An empty multiboot2 command clears the incomplete loader before GRUB's
    # implicit boot at the end of a menu entry.
    multiboot2
    echo "Could not load the ReliefOS installer image. Check the installation medium and available memory."
}

menuentry "Install ReliefOS" {
    reliefos_install
}

menuentry "Install ReliefOS (console session)" {
    reliefos_install installer-session=tui
}

menuentry "Reboot" {
    reboot
}
