set timeout=5
set default=0
insmod serial
insmod terminal
insmod part_gpt
insmod fat
insmod multiboot2
insmod regexp
insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
# A per-instance EFI wrapper or BIOS prefix identifies its own boot tree.
set reliefos_directory=
set reliefos_root=
set reliefos_prefix_device=
regexp --set=1:reliefos_prefix_device '^\(([^)]+)\)' "$prefix"
if [ "$reliefos_prefix_device" = "$root" ]; then
    regexp --set=1:reliefos_directory '^\([^)]*\)(.*)/grub$' "$prefix"
fi
if [ -f ($root)$reliefos_directory/reliefos/config/root.cfg ]; then
    source ($root)$reliefos_directory/reliefos/config/root.cfg
fi
export reliefos_root reliefos_directory
if [ -f ($root)$reliefos_directory/grub/fonts/leonos-unicode.pf2 ]; then
    loadfont ($root)$reliefos_directory/grub/fonts/leonos-unicode.pf2
fi
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=1920x1080,1280x800,1024x768,auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm
set theme=($root)$reliefos_directory/grub/theme/theme.txt
export theme
source ($root)$reliefos_directory/grub/kernel-slots.cfg
if ! regexp '^PARTUUID=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' "$reliefos_root"; then
    set reliefos_boot_ready=0
    set timeout=-1
    echo "ReliefOS: missing or invalid root identity; use installation media to repair boot files."
fi

if [ "$reliefos_boot_ready" = 1 ]; then
    menuentry "ReliefOS" {
        multiboot2 $reliefos_kernel root=$reliefos_root log=screen,serial
        module2 $reliefos_initramfs initramfs
        set gfxpayload=keep
        boot
    }
    submenu "Advanced options" {
        menuentry "Pause after startup diagnostics" {
            multiboot2 $reliefos_kernel root=$reliefos_root log=screen,serial bootlog-pause=1
            module2 $reliefos_initramfs initramfs
            set gfxpayload=keep
            boot
        }
        menuentry "Start without kernel log colors" {
            multiboot2 $reliefos_kernel root=$reliefos_root log=screen,serial logcolor=0
            module2 $reliefos_initramfs initramfs
            set gfxpayload=keep
            boot
        }
        if [ -n "$reliefos_previous_release" ]; then
            menuentry "Previous complete kernel" {
                multiboot2 $reliefos_previous_directory/kernel.sys root=$reliefos_root log=screen,serial
                module2 $reliefos_previous_directory/initramfs.cpio initramfs
                set gfxpayload=keep
                boot
            }
        fi
    }
fi
source ($root)$reliefos_directory/grub/other-systems.cfg
menuentry "Reboot" { reboot }
