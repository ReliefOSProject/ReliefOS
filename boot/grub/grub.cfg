set timeout=5
set default=0
insmod serial
insmod terminal
insmod part_gpt
insmod fat
insmod multiboot2
insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
set reliefos_root=PARTUUID=5c13543b-732c-4f81-8652-621124484420
if [ -f ($root)/reliefos/config/root.cfg ]; then
    source ($root)/reliefos/config/root.cfg
fi
export reliefos_root
if [ -f ($root)/grub/fonts/leonos-unicode.pf2 ]; then
    loadfont ($root)/grub/fonts/leonos-unicode.pf2
fi
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=1920x1080,1280x800,1024x768,auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm
set theme=($root)/grub/theme/theme.txt
export theme
source ($root)/grub/kernel-slots.cfg

if [ "$reliefos_boot_ready" = 1 ]; then
menuentry "ReliefOS" {
    multiboot2 $reliefos_kernel root=$reliefos_root log=screen,serial
    module2 $reliefos_initramfs initramfs
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}

menuentry "ReliefOS (console log)" {
    multiboot2 $reliefos_kernel root=$reliefos_root log=screen,serial bootlog=1
    module2 $reliefos_initramfs initramfs
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}

menuentry "ReliefOS (with boot log)" {
    multiboot2 $reliefos_kernel root=$reliefos_root log=screen,serial bootlog=1 bootlog-pause=1
    module2 $reliefos_initramfs initramfs
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}

menuentry "ReliefOS (debug mode)" {
    multiboot2 $reliefos_kernel root=$reliefos_root log=screen,serial bootlog=1 debug=1 autospawn=hello autospawn=uidemo autospawn=memtest
    module2 $reliefos_initramfs initramfs
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}

menuentry "ReliefOS (SVGA II 3D test)" {
    multiboot2 $reliefos_kernel root=$reliefos_root log=screen,serial svga3d-triangle=1 bootlog=1 bootlog-pause=1
    module2 $reliefos_initramfs initramfs
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}
fi

if [ -n "$reliefos_previous_release" ]; then
    menuentry "ReliefOS (previous complete kernel)" {
        multiboot2 $reliefos_previous_directory/kernel.sys root=$reliefos_root log=screen,serial
        module2 $reliefos_previous_directory/initramfs.cpio initramfs
        set gfxpayload=keep
        boot
    }
fi

# Imported aliases are exposed only when BOTH files match a checked selection.
# A kernel-only legacy copy cannot establish a safe modular boot entry.
if [ "$reliefos_boot_ready" = 1 ]; then
if [ -f ($root)/leonos/kernel.sys -a -f ($root)/leonos/initramfs.cpio ]; then
if cmp ($root)/leonos/kernel.sys ($root)$reliefos_kernel; then
if cmp ($root)/leonos/initramfs.cpio ($root)$reliefos_initramfs; then
    menuentry "ReliefOS (legacy rollback)" {
        multiboot2 /leonos/kernel.sys root=$reliefos_root log=screen,serial
        module2 /leonos/initramfs.cpio initramfs
        # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
        set gfxpayload=keep
        boot
    }
fi
fi
fi
fi

menuentry "Reboot" {
    reboot
}
