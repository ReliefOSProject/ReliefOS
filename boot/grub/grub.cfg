set timeout=5
set default=0
insmod serial
insmod terminal
insmod part_gpt
insmod fat
insmod multiboot2
insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
set reliefos_root=/
if [ -f ($root)/reliefos/config/root.cfg ]; then
    source ($root)/reliefos/config/root.cfg
fi
export reliefos_root
if [ -f ($root)/grub/fonts/leonos-unicode.pf2 ]; then
    loadfont ($root)/grub/fonts/leonos-unicode.pf2
fi
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=1920x1080,1280x800,1024x768,auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm
set theme=($root)/grub/theme/theme.txt
export theme

menuentry "ReliefOS" {
    multiboot2 /reliefos/kernel.sys root=$reliefos_root log=screen,serial
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}

menuentry "ReliefOS (console log)" {
    multiboot2 /reliefos/kernel.sys root=$reliefos_root log=screen,serial bootlog=1
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}

menuentry "ReliefOS (with boot log)" {
    multiboot2 /reliefos/kernel.sys root=$reliefos_root log=screen,serial bootlog=1 bootlog-pause=1
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}

menuentry "ReliefOS (debug mode)" {
    multiboot2 /reliefos/kernel.sys root=$reliefos_root log=screen,serial bootlog=1 debug=1 autospawn=hello autospawn=uidemo autospawn=memtest
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}

menuentry "ReliefOS (SVGA II 3D test)" {
    multiboot2 /reliefos/kernel.sys root=$reliefos_root log=screen,serial svga3d-triangle=1 bootlog=1 bootlog-pause=1
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    boot
}

# Imported kernels can predate root=PARTUUID support. Keep their bytes for
# recovery, but expose automatic rollback only when it is the current kernel.
# Upstream cmp is quiet by default (only -v enables diagnostics).
if cmp ($root)/leonos/kernel.sys ($root)/reliefos/kernel.sys; then
    menuentry "ReliefOS (legacy rollback)" {
        multiboot2 /leonos/kernel.sys root=$reliefos_root log=screen,serial
        # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
        set gfxpayload=keep
        boot
    }
fi

menuentry "Reboot" {
    reboot
}
