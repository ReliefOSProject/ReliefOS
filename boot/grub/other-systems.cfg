# Enumerate installed boot trees and EFI applications at boot, including disks
# added after installation. Never execute another system's config automatically.
insmod regexp
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod ntfs
for config in (*)/reliefos/instances/*/grub/grub.cfg; do
    if [ -f "$config" -a "$config" != "($root)$reliefos_directory/grub/grub.cfg" ]; then
      if regexp --set=1:device --set=2:instance_uuid '^(.*)/reliefos/instances/([0-9a-f-]{36})/grub/grub.cfg$' "$config"; then
        menuentry "ReliefOS ($instance_uuid on $device)" "$config" {
            set prefix=$2
            regexp --set=1:prefix '^(.*)/grub.cfg$' "$prefix"
            regexp --set=1:root '^\(([^)]+)\)' "$prefix"
            configfile $prefix/grub.cfg
        }
      fi
    fi
done
for config in (*)/grub/grub.cfg; do
    if regexp --set=1:device '^(.*)/grub/grub.cfg$' "$config"; then
        if [ -f "$config" -a -f "$device/reliefos/config/root.cfg" -a "$config" != "($root)$reliefos_directory/grub/grub.cfg" ]; then
            menuentry "ReliefOS ($device)" "$config" {
                regexp --set=1:root '^\(([^)]+)\)' "$2"
                regexp --set=1:prefix '^(.*)/grub.cfg$' "$2"
                configfile "$2"
            }
        fi
    fi
done
if [ "$grub_platform" = efi ]; then
    insmod chain
    for vendor in (*)/EFI/*; do
        if regexp '/EFI/(ReliefOS|BOOT|boot)$' "$vendor"; then continue; fi
        set loader=
        if [ -f "$vendor/Boot/bootmgfw.efi" ]; then
            set loader=$vendor/Boot/bootmgfw.efi
        elif [ -f "$vendor/shimx64.efi" ]; then
            set loader=$vendor/shimx64.efi
        elif [ -f "$vendor/grubx64.efi" ]; then
            set loader=$vendor/grubx64.efi
        elif [ -f "$vendor/systemd-bootx64.efi" ]; then
            set loader=$vendor/systemd-bootx64.efi
        elif [ -f "$vendor/bootx64.efi" ]; then
            set loader=$vendor/bootx64.efi
        fi
        if [ -n "$loader" ]; then
            regexp --set=1:system_name '/EFI/([^/]+)$' "$vendor"
            menuentry "$system_name" "$loader" {
                chainloader "$2"
                boot
            }
        fi
    done
    for loader in (*)/EFI/BOOT/BOOTX64.EFI; do
        regexp --set=1:device '^(.*)/EFI/BOOT/BOOTX64.EFI$' "$loader"
        if [ -f "$loader" -a ! -f "$device/EFI/BOOT/reliefos-owner" -a ! -f "$device/reliefos/config/root.cfg" ]; then
            menuentry "Other EFI bootloader ($device)" "$loader" {
                chainloader "$2"
                boot
            }
        fi
    done
else
    for manager in (*)/bootmgr; do
        if [ -f "$manager" ]; then
            menuentry "Windows (BIOS)" "$manager" {
                regexp --set=1:root '^\(([^)]+)\)' "$2"
                chainloader +1
                boot
            }
        fi
    done
    for device in (*); do
        set config=
        if [ -f "$device/boot/grub/grub.cfg" ]; then
            set config=$device/boot/grub/grub.cfg
        elif [ -f "$device/boot/grub2/grub.cfg" ]; then
            set config=$device/boot/grub2/grub.cfg
        elif [ -f "$device/grub/grub.cfg" -a ! -f "$device/reliefos/config/root.cfg" ]; then
            set config=$device/grub/grub.cfg
        fi
        if [ -n "$config" -a "$config" != "($root)$reliefos_directory/grub/grub.cfg" ]; then
            menuentry "Other system ($device)" "$config" {
                regexp --set=1:root '^\(([^)]+)\)' "$2"
                regexp --set=1:prefix '^(.*)/grub.cfg$' "$2"
                configfile "$2"
            }
        fi
    done
fi
