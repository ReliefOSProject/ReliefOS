# reliefos-boot-health-v1
# Stable selector. Only whitelisted scalar values are loaded from checked GRUB
# environment blocks; neither a slot nor version metadata is sourced as code.
insmod hashsum
insmod gcry_sha256
insmod loadenv
insmod regexp
insmod test

# Mutable health is bound to a checked immutable generation. Missing metadata
# is accepted only before the native publisher's durable migration marker.
function reliefos_read_health {
    set reliefos_health_valid=0
    set reliefos_boot_generation=
    set reliefos_boot_confirmed=
    set reliefos_boot_remaining=
    if [ ! -f ($root)$reliefos_directory/reliefos/state/boot-health-v1 ]; then
        set reliefos_boot_generation=$reliefos_s_generation
        set reliefos_boot_confirmed=1
        set reliefos_boot_remaining=0
        set reliefos_health_valid=1
        return 0
    fi
    if load_env --file=($root)$reliefos_directory/reliefos/state/kernel-$1.health reliefos_boot_generation reliefos_boot_confirmed reliefos_boot_remaining; then
        if [ "$reliefos_boot_generation" != "$reliefos_s_generation" ]; then return 1; fi
        if [ "$reliefos_boot_confirmed" = 1 -a "$reliefos_boot_remaining" = 0 ]; then
            set reliefos_health_valid=1
            return 0
        fi
        if [ "$reliefos_boot_confirmed" = 0 ]; then
            if [ "$reliefos_boot_remaining" = 0 -o "$reliefos_boot_remaining" = 1 ]; then
                set reliefos_health_valid=1
                return 0
            fi
        fi
    fi
    return 1
}

function reliefos_read_slot {
    set reliefos_slot_valid=0
    set reliefos_generation=
    set reliefos_release=
    set reliefos_module_abi=
    set reliefos_kernel_sha256=
    set reliefos_initramfs_sha256=
    if [ -s ($root)$reliefos_directory/reliefos/state/kernel-$1.env -a -s ($root)$reliefos_directory/reliefos/state/kernel-$1.sha256 ]; then
        if hashsum --hash sha256 --check ($root)$reliefos_directory/reliefos/state/kernel-$1.sha256 --prefix ($root)$reliefos_directory/reliefos/state; then
            load_env --file=($root)$reliefos_directory/reliefos/state/kernel-$1.env reliefos_generation reliefos_release reliefos_module_abi reliefos_kernel_sha256 reliefos_initramfs_sha256
        else
            return 1
        fi
    else
        return 1
    fi
    # Keep the slot unpublished until every scalar and payload check succeeds.
    # Use built-in set rather than relying on an autoloaded no-op command.
    if regexp '^[1-9][0-9]{0,9}$' "$reliefos_generation"; then set reliefos_slot_valid=0; else return 1; fi
    if [ "$reliefos_generation" -le 2147483647 ]; then set reliefos_slot_valid=0; else return 1; fi
    if regexp '^[A-Za-z0-9][A-Za-z0-9._+-]{11,30}$' "$reliefos_release"; then set reliefos_slot_valid=0; else return 1; fi
    if regexp '^[0-9a-f]{64}$' "$reliefos_module_abi"; then set reliefos_slot_valid=0; else return 1; fi
    if regexp '^[0-9a-f]{64}$' "$reliefos_kernel_sha256"; then set reliefos_slot_valid=0; else return 1; fi
    if regexp '^[0-9a-f]{64}$' "$reliefos_initramfs_sha256"; then set reliefos_slot_valid=0; else return 1; fi
    if regexp --set=1:reliefos_suffix '([0-9a-f]{12})$' "$reliefos_release"; then set reliefos_slot_valid=0; else return 1; fi
    if regexp --set=1:reliefos_abi_prefix '^([0-9a-f]{12})' "$reliefos_module_abi"; then set reliefos_slot_valid=0; else return 1; fi
    if [ "$reliefos_suffix" != "$reliefos_abi_prefix" ]; then
        return 1
    fi
    set reliefos_s_generation=$reliefos_generation
    set reliefos_s_release=$reliefos_release
    set reliefos_s_abi=$reliefos_module_abi
    set reliefos_s_kernel=$reliefos_kernel_sha256
    set reliefos_s_initramfs=$reliefos_initramfs_sha256
    set reliefos_version_dir=($root)$reliefos_directory/reliefos/versions/$reliefos_release/$reliefos_initramfs_sha256
    if [ -s $reliefos_version_dir/SHA256SUMS -a -s $reliefos_version_dir/boot.env ]; then
        if hashsum --hash sha256 --check $reliefos_version_dir/SHA256SUMS --prefix $reliefos_version_dir; then
            # A list can lose a whole record while its remaining hashes pass.
            # Always verify both loaded files against the checked slot scalars.
            if hashsum --hash sha256 --expected $reliefos_s_kernel $reliefos_version_dir/kernel.sys; then set reliefos_slot_valid=0; else return 1; fi
            if hashsum --hash sha256 --expected $reliefos_s_initramfs $reliefos_version_dir/initramfs.cpio; then set reliefos_slot_valid=0; else return 1; fi
            set reliefos_generation=
            set reliefos_release=
            set reliefos_module_abi=
            set reliefos_kernel_sha256=
            set reliefos_initramfs_sha256=
            load_env --file=$reliefos_version_dir/boot.env reliefos_generation reliefos_release reliefos_module_abi reliefos_kernel_sha256 reliefos_initramfs_sha256
            if [ "$reliefos_generation" = 1 -a "$reliefos_release" = "$reliefos_s_release" -a "$reliefos_module_abi" = "$reliefos_s_abi" -a "$reliefos_kernel_sha256" = "$reliefos_s_kernel" -a "$reliefos_initramfs_sha256" = "$reliefos_s_initramfs" ]; then
                set reliefos_generation=$reliefos_s_generation
                if reliefos_read_health $1; then
                    set reliefos_slot_valid=1
                    return 0
                fi
            fi
        fi
    fi
    return 1
}

reliefos_read_slot A
set reliefos_a_valid=$reliefos_slot_valid
set reliefos_a_generation=$reliefos_generation
set reliefos_a_release=$reliefos_release
set reliefos_a_abi=$reliefos_module_abi
set reliefos_a_kernel=$reliefos_kernel_sha256
set reliefos_a_initramfs=$reliefos_initramfs_sha256
set reliefos_a_confirmed=$reliefos_boot_confirmed
set reliefos_a_remaining=$reliefos_boot_remaining
reliefos_read_slot B
set reliefos_b_valid=$reliefos_slot_valid
set reliefos_b_generation=$reliefos_generation
set reliefos_b_release=$reliefos_release
set reliefos_b_abi=$reliefos_module_abi
set reliefos_b_kernel=$reliefos_kernel_sha256
set reliefos_b_initramfs=$reliefos_initramfs_sha256
set reliefos_b_confirmed=$reliefos_boot_confirmed
set reliefos_b_remaining=$reliefos_boot_remaining

set reliefos_boot_ready=0
set reliefos_previous_release=
set reliefos_previous_directory=
if [ "$reliefos_a_valid" = 1 -a "$reliefos_b_valid" = 1 ]; then
    if [ "$reliefos_a_generation" = "$reliefos_b_generation" ]; then
        if [ "$reliefos_a_release" != "$reliefos_b_release" -o "$reliefos_a_abi" != "$reliefos_b_abi" -o "$reliefos_a_kernel" != "$reliefos_b_kernel" -o "$reliefos_a_initramfs" != "$reliefos_b_initramfs" ]; then
            set reliefos_a_valid=0
            set reliefos_b_valid=0
            echo "ReliefOS: conflicting kernel generations; automatic boot disabled."
        fi
    fi
fi
# An unconfirmed generation has one launch. A reset/panic before confirmation
# leaves zero attempts, so the next invocation selects the retained good slot.
if [ "$reliefos_a_confirmed" = 0 -a "$reliefos_a_remaining" = 0 ]; then set reliefos_a_valid=0; fi
if [ "$reliefos_b_confirmed" = 0 -a "$reliefos_b_remaining" = 0 ]; then set reliefos_b_valid=0; fi
function reliefos_select_a {
    set reliefos_selected=A
    set reliefos_selected_generation=$reliefos_a_generation
    set reliefos_selected_release=$reliefos_a_release
    set reliefos_selected_initramfs=$reliefos_a_initramfs
    set reliefos_selected_confirmed=$reliefos_a_confirmed
    set reliefos_selected_remaining=$reliefos_a_remaining
    set reliefos_boot_ready=1
}
function reliefos_select_b {
    set reliefos_selected=B
    set reliefos_selected_generation=$reliefos_b_generation
    set reliefos_selected_release=$reliefos_b_release
    set reliefos_selected_initramfs=$reliefos_b_initramfs
    set reliefos_selected_confirmed=$reliefos_b_confirmed
    set reliefos_selected_remaining=$reliefos_b_remaining
    set reliefos_boot_ready=1
}
function reliefos_boot_paths {
    set reliefos_kernel=$reliefos_directory/reliefos/versions/$reliefos_selected_release/$reliefos_selected_initramfs/kernel.sys
    set reliefos_initramfs=$reliefos_directory/reliefos/versions/$reliefos_selected_release/$reliefos_selected_initramfs/initramfs.cpio
}
if [ "$reliefos_a_valid" = 1 ]; then reliefos_select_a; fi
if [ "$reliefos_b_valid" = 1 ]; then
    if [ "$reliefos_boot_ready" = 0 ]; then
        reliefos_select_b
    elif [ "$reliefos_b_generation" -gt "$reliefos_a_generation" ]; then
        reliefos_select_b
    fi
fi
if [ "$reliefos_boot_ready" = 1 ]; then
    reliefos_boot_paths
    if [ "$reliefos_selected" = A -a "$reliefos_b_valid" = 1 -a "$reliefos_b_confirmed" = 1 ]; then
        set reliefos_previous_release=$reliefos_b_release
        set reliefos_previous_directory=$reliefos_directory/reliefos/versions/$reliefos_b_release/$reliefos_b_initramfs
        set reliefos_previous_slot=B
        set reliefos_previous_generation=$reliefos_b_generation
        set reliefos_previous_initramfs=$reliefos_b_initramfs
    elif [ "$reliefos_selected" = B -a "$reliefos_a_valid" = 1 -a "$reliefos_a_confirmed" = 1 ]; then
        set reliefos_previous_release=$reliefos_a_release
        set reliefos_previous_directory=$reliefos_directory/reliefos/versions/$reliefos_a_release/$reliefos_a_initramfs
        set reliefos_previous_slot=A
        set reliefos_previous_generation=$reliefos_a_generation
        set reliefos_previous_initramfs=$reliefos_a_initramfs
    fi
    echo "ReliefOS: checked boot slot $reliefos_selected, release $reliefos_selected_release"
else
    set timeout=-1
    echo "ReliefOS: no complete confirmed or untried kernel; use recovery media."
fi

# Called when a menu entry actually launches, never just for opening the menu.
# GRUB writes only its already allocated regular environment file. Failure to
# persist/read back consumption refuses the trial and keeps the confirmed boot.
function reliefos_prepare_boot {
    if [ "$reliefos_boot_ready" != 1 ]; then return 1; fi
    if [ "$reliefos_selected_confirmed" != 1 ]; then
        set reliefos_trial_saved=0
        if [ "$reliefos_selected_remaining" = 1 ]; then
            set reliefos_boot_remaining=0
            if save_env --file=($root)$reliefos_directory/reliefos/state/kernel-$reliefos_selected.health reliefos_boot_remaining; then
                set reliefos_boot_generation=
                set reliefos_boot_confirmed=
                set reliefos_boot_remaining=
                if load_env --file=($root)$reliefos_directory/reliefos/state/kernel-$reliefos_selected.health reliefos_boot_generation reliefos_boot_confirmed reliefos_boot_remaining; then
                    if [ "$reliefos_boot_generation" = "$reliefos_selected_generation" -a "$reliefos_boot_confirmed" = 0 -a "$reliefos_boot_remaining" = 0 ]; then
                        set reliefos_trial_saved=1
                    fi
                fi
            fi
        fi
        set reliefos_selected_remaining=0
        if [ "$reliefos_trial_saved" != 1 ]; then
            if [ "$reliefos_selected" = B -a "$reliefos_a_valid" = 1 -a "$reliefos_a_confirmed" = 1 ]; then
                reliefos_select_a
            elif [ "$reliefos_selected" = A -a "$reliefos_b_valid" = 1 -a "$reliefos_b_confirmed" = 1 ]; then
                reliefos_select_b
            else
                echo "ReliefOS: cannot persist boot trial; refusing unconfirmed kernel."
                return 1
            fi
            echo "ReliefOS: trial not persisted; using confirmed slot $reliefos_selected"
        fi
    fi
    reliefos_boot_paths
    return 0
}
export reliefos_boot_ready reliefos_kernel reliefos_initramfs reliefos_previous_release reliefos_previous_directory
export reliefos_selected reliefos_selected_generation reliefos_selected_initramfs
export reliefos_previous_slot reliefos_previous_generation reliefos_previous_initramfs
