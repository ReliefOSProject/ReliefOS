set timeout=5
set default=0
insmod serial
insmod terminal
insmod fat
insmod iso9660
insmod multiboot2
insmod all_video
insmod font
insmod gfxterm
if ! search --no-floppy --file /reliefos-installer-iso.marker --set=root; then
    search --no-floppy --file /leonos-installer-iso.marker --set=root
fi
loadfont /grub/fonts/leonos-unicode.pf2
set gfxmode=1920x1080,1280x800,1024x768,auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm serial

menuentry "ReliefOS Live Desktop (musl + Vim + GCC)" {
    multiboot2 /reliefos/kernel.sys root=/ log=screen,serial bootlog=1 mode=live
    module2 /reliefos/initramfs.cpio initramfs
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    module2 /install/root.fat reliefos-installer-root
    boot
}

menuentry "ReliefOS Live Desktop (boot log)" {
    multiboot2 /reliefos/kernel.sys root=/ log=screen,serial mode=live bootlog=1
    module2 /reliefos/initramfs.cpio initramfs
    # Multiboot2 applies its framebuffer hint while loading; retain the menu mode.
    set gfxpayload=keep
    module2 /install/root.fat reliefos-installer-root
    boot
}
