<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- FLTK 1.3's built-in families are stable across locales. Map only
       Dillo's generic requests, before later generic fallback expansion. -->
  <match target="pattern">
    <test name="prgname" compare="eq"><string>dillo</string></test>
    <test name="family" qual="first" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SimSun</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="eq"><string>dillo</string></test>
    <test name="family" qual="first" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SimSun</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="eq"><string>dillo</string></test>
    <test name="family" qual="first" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NSimSun</string></edit>
  </match>
</fontconfig>
