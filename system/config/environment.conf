# ReliefOS global environment variables.
# Use one NAME=VALUE entry per line. Lines beginning with '#' are ignored.
# Per-user overrides are stored in /home/<username>/.environment.
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
SHELL=/bin/bash
LANG=zh_CN.UTF-8
MUSL_LOCPATH=/usr/share/musl/locales
