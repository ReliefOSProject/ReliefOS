Section "ServerLayout"
    Identifier "ReliefOS"
    Screen 0 "Screen0"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0" "CorePointer"
    Option "AutoAddDevices" "off"
    Option "DontVTSwitch" "off"
EndSection

Section "ServerFlags"
    Option "DontZap" "off"
EndSection

Section "Monitor"
    Identifier "Monitor0"
EndSection

Section "Device"
    Identifier "Card0"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    Monitor "Monitor0"
    # VMware SVGA exposes a true-color 24-bit depth in a 32bpp scanout.
    # Asking fbdev for 16bpp makes FBIOPUT_VSCREENINFO fail during ScreenInit.
    DefaultDepth 24
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection
