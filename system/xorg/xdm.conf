DisplayManager.authDir: /var/lib/xdm
DisplayManager.errorLogFile: /var/log/xdm.log
DisplayManager.pidFile: /run/xdm.pid
DisplayManager.servers: /etc/X11/xdm/Xservers
! XDM rebuilds the authenticated session environment from this allow-list.
DisplayManager.exportList: RELIEFOS_XORG_EVENT_FD
DisplayManager*resources: /etc/X11/xdm/Xresources
DisplayManager*authorize: true
DisplayManager*startup: /bin/true
DisplayManager*session: /usr/lib/X11/xdm/Xsession
DisplayManager*reset: /bin/true
DisplayManager._0.setup: /usr/lib/X11/xdm/Xsetup_0
DisplayManager._0.startup: /bin/true
DisplayManager._0.reset: /bin/true
DisplayManager.requestPort: 0
