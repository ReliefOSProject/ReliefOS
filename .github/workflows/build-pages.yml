name: Build ReliefOS Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. cancel-in-progress is false because a
# half-finished deployment would publish a partial tree.
concurrency:
  group: reliefos-pages
  cancel-in-progress: false

jobs:
  # One job builds the entire release: kernel, userland, APK repository,
  # installer ISO and every page. Any failure in any stage aborts the whole
  # job, so GitHub Pages never sees a half-built artifact (plan §44, §45).
  build-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-rt-dev llvm lld \
            grub-efi-amd64-bin grub-pc-bin grub-common xorriso mtools \
            dosfstools e2fsprogs libext2fs-dev fdisk fakeroot gdisk qemu-utils zip \
            git make bison flex bc pkg-config autoconf automake libtool \
            libtool-bin gawk gperf gettext libncurses-dev ncurses-bin exfatprogs openssl perl python3-sphinx
          msgfmt --version

      # APK staging executes package triggers chrooted inside the target root
      # via `unshare -Ur`. Ubuntu 24.04 restricts unprivileged user namespaces
      # by default (AppArmor), so lift the restriction and assert the capability
      # here instead of failing deep inside the build.
      - name: Enable unprivileged user namespaces
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          unshare -Ur true

      - name: Verify third-party sources
        run: |
          set -euo pipefail
          test -f third_party/musl/configure
          test -f third_party/busybox/Makefile
          git -C third_party/musl rev-parse --verify HEAD
          git submodule status --recursive

      - name: Import APK signing key
        id: signing_key
        env:
          RELIEFOS_APK_SIGNING_KEY_B64: ${{ secrets.RELIEFOS_APK_SIGNING_KEY_B64 }}
          LEONOS_APK_SIGNING_KEY_B64: ${{ secrets.LEONOS_APK_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          APK_SIGNING_KEY_B64="${RELIEFOS_APK_SIGNING_KEY_B64:-${LEONOS_APK_SIGNING_KEY_B64:-}}"
          test -n "$APK_SIGNING_KEY_B64" || {
            echo 'Missing GitHub Secret: RELIEFOS_APK_SIGNING_KEY_B64 (or legacy LEONOS_APK_SIGNING_KEY_B64)' >&2
            exit 1
          }
          key_path="$RUNNER_TEMP/reliefos-rpr-signing-key.rsa"
          umask 077
          printf '%s' "$APK_SIGNING_KEY_B64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          openssl pkey -in "$key_path" -noout -check >/dev/null
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Prepare build configuration
        run: |
          set -euo pipefail
          make fetch
          # kernel/reliefnt submodule cache (unifont); its cache/ is untracked
          make -C kernel/reliefnt fetch
          make defconfig
          make olddefconfig

      # Single build call: `make pages` depends on installer + rpr-pages, so
      # the kernel, userland, APK repository and every page all come from this
      # one build (plan §30, §31, §45).
      - name: Build Pages tree
        env:
          RELIEFOS_APK_SIGNING_KEY: ${{ steps.signing_key.outputs.path }}
        run: |
          set -euo pipefail
          make -j"$(nproc)" APK_SIGNING_KEY="$RELIEFOS_APK_SIGNING_KEY" pages

      - name: Verify Pages tree
        run: |
          set -euo pipefail
          sh tools/build/verify-pages.sh out/x86_64/release/pages

      - name: Remove private key
        if: always() && steps.signing_key.outputs.path != ''
        env:
          KEY_PATH: ${{ steps.signing_key.outputs.path }}
        run: rm -f -- "$KEY_PATH"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/x86_64/release/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
