name: Sync ReliefOS branches to SourceHut

on:
  push:
    branches: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliefos-sourcehut-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Mirror branches
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCEHUT_REPOSITORIES: git@git.sr.ht:~leonmmcoset/LeonOS-4
    steps:
      - name: Checkout the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'delete' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: true
      - name: Configure pinned SSH trust and remotes
        env:
          SOURCEHUT_SSH_PRIVATE_KEY: ${{ secrets.SOURCEHUT_SSH_PRIVATE_KEY }}
        run: bash scripts/ci/sourcehut-setup.sh
      - name: Synchronize and prune branches
        run: bash scripts/ci/sourcehut-sync.sh
      - name: Remove SSH private key
        if: always()
        run: rm -f -- "$HOME/.ssh/sourcehut_sync_key"
