name: ReliefOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      installer_root_size_mib:
        description: Installer runtime root size in MiB (32-4096)
        default: '400'
        type: string
      deploy_pages:
        description: Publish the verified build to Pages (main only)
        default: false
        type: boolean

permissions:
  contents: read

# Superseded PRs can stop; running main builds and deployments finish.
concurrency:
  group: reliefos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
      docs: ${{ steps.scope.outputs.docs }}
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks for this commit
        id: scope
        run: python3 tools/ci.py changes

  checks:
    name: Workflow and orchestration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned workflow linter
        id: actionlint-cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/ci-tools
          key: actionlint-v1.7.12-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install pinned workflow linter
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/ci-tools
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint GitHub Actions workflows
        env:
          GOBIN: ${{ runner.temp }}/ci-tools
        run: '"$GOBIN/actionlint" -color'
      - name: Check CI scripts
        run: |
          shellcheck scripts/ci/*.sh
          python3 -m unittest discover -s tools/tests -p test_ci.py -v

  documentation:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/check-docs.yml

  build:
    name: Build and regression tests
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/cache/ccache
      # Kbuild's native source/dependency records retain their absolute paths.
      CCACHE_BASEDIR: ''
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Rollback regressions exercise historical kernel commits as well.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          profile: build
      - name: Restore locked dependency downloads
        id: download-cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            cache/downloads
            kernel/reliefnt/cache/downloads
          key: downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('configs/dependencies.lock.json', 'kernel/reliefnt/configs/dependencies.lock.json') }}
          restore-keys: |
            downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Prepare build configuration
        env:
          INSTALLER_ROOT_SIZE_MIB: ${{ inputs.installer_root_size_mib || '400' }}
        run: bash scripts/ci/configure.sh
      - name: Save verified dependency downloads
        if: steps.download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            cache/downloads
            kernel/reliefnt/cache/downloads
          key: ${{ steps.download-cache.outputs.cache-primary-key }}
      - name: Prepare APK signing key
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.publish == 'true' }}
          RELIEFOS_APK_SIGNING_KEY_B64: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.publish == 'true' && secrets.RELIEFOS_APK_SIGNING_KEY_B64 || '' }}
          LEONOS_APK_SIGNING_KEY_B64: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.publish == 'true' && secrets.LEONOS_APK_SIGNING_KEY_B64 || '' }}
        run: |
          key_path="$RUNNER_TEMP/reliefos-ci-signing-key.rsa"
          umask 077
          if [[ "$PUBLISH" == true ]]; then
            encoded_key="${RELIEFOS_APK_SIGNING_KEY_B64:-${LEONOS_APK_SIGNING_KEY_B64:-}}"
            test -n "$encoded_key" || { echo 'Missing APK signing secret' >&2; exit 1; }
            printf '%s' "$encoded_key" | base64 --decode > "$key_path"
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_path" 2>/dev/null
          fi
          chmod 0600 "$key_path"
          openssl pkey -in "$key_path" -noout -check >/dev/null
          printf 'APK_SIGNING_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"
      - name: Build images and Pages from the same products
        run: |
          mkdir -p out/x86_64/release/ci
          make -j"$(nproc)" APK_SIGNING_KEY="$APK_SIGNING_KEY" all pages 2>&1 | tee out/x86_64/release/ci/build.log
      - name: Run host and build regressions
        timeout-minutes: 60
        run: |
          mkdir -p out/tmp
          TMPDIR="$PWD/out/tmp" make -j"$(nproc)" APK_SIGNING_KEY="$APK_SIGNING_KEY" test 2>&1 | tee out/x86_64/release/ci/regressions.log
      - name: Verify products and record their identity
        run: |
          qemu-img info out/x86_64/release/images/reliefos.vmdk
          python3 tools/ci.py manifest --root out/x86_64/release --pages out/x86_64/release/pages
          sh tools/build/verify-pages.sh out/x86_64/release/pages
          python3 tools/test_documentation.py --site out/x86_64/release/pages/docs
      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/reliefos-ci-signing-key.rsa"
      - name: Report compiler cache usage
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: |
          ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload images for boot verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reliefos-images-${{ github.sha }}
          path: |
            out/x86_64/release/images/reliefos.vmdk
            out/x86_64/release/images/reliefos-live.iso
            out/x86_64/release/images/reliefos-installer.iso
            out/x86_64/release/.config
            out/x86_64/release/kernel-install/install.bundle.json
            out/x86_64/release/ci/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload verified Pages tree
        if: needs.changes.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/x86_64/release/pages
          include-hidden-files: true
          retention-days: 3
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ github.sha }}
          path: |
            out/x86_64/release/logs
            out/x86_64/release/ci
            out/kbuild-migration
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Boot (${{ matrix.firmware }})
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          profile: smoke
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reliefos-images-${{ github.sha }}
          path: out/x86_64/release
      - name: Verify and boot the downloaded images
        env:
          SMOKE_FIRMWARE: ${{ matrix.firmware }}
        run: bash scripts/ci/smoke.sh
      - name: Preserve boot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-evidence-${{ matrix.firmware }}-${{ github.sha }}
          path: |
            out/ci-smoke/**/results.json
            out/ci-smoke/**/settings.json
            out/ci-smoke/**/sources*.json
            out/ci-smoke/**/*.log
            out/ci-smoke/**/*.png
            out/ci-smoke/**/command.json
            out/ci-smoke/**/failure-*.json
          if-no-files-found: warn
          retention-days: 7

  ci:
    name: CI result
    needs: [changes, checks, documentation, build, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report every required stage
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci.py summary

  deploy:
    name: Deploy verified Pages
    needs: [changes, ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: reliefos-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the artifact from this run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
