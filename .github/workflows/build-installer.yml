name: Build ReliefOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      installer_root_size_mib:
        description: Installer runtime root size in MiB (32-4096)
        required: false
        default: "400"
        type: string
      installed_system_requires_license:
        description: Require activation after the installer deploys the system
        required: false
        default: false
        type: boolean
      license_server_url:
        description: HTTP(S) license server URL baked into the installer
        required: false
        default: http://127.0.0.1:30301
        type: string
      license_debug_log:
        description: Include license and OOBE activation debug logs
        required: false
        default: true
        type: boolean
      # ---------- 新增输入 ----------
      upload_artifacts:
        description: Upload build artifacts (VMDK, ISO, etc.)
        required: false
        default: false
        type: boolean
      # -----------------------------

permissions:
  contents: read

concurrency:
  group: reliefos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-rt-dev \
            llvm \
            lld \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            dosfstools \
            e2fsprogs \
            libext2fs-dev \
            fdisk \
            zip \
            openssl \
            fakeroot \
            gdisk \
            qemu-utils \
            git \
            make \
            bison \
            flex \
            gperf \
            gettext \
            perl \
            libncurses-dev \
            bc \
            pkg-config \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            gawk \
            ncurses-bin \
            exfatprogs

      # APK staging executes package triggers chrooted inside the target root
      # via `unshare -Ur`. Ubuntu 24.04 restricts unprivileged user namespaces
      # by default (AppArmor), so lift the restriction and assert the capability
      # here instead of failing deep inside the build.
      - name: Enable unprivileged user namespaces
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          unshare -Ur true

      - name: Verify toolchain
        run: |
          set -euo pipefail

          clang --version
          ld.lld --version
          llvm-ar --version
          grub-mkstandalone --version
          grub-mkrescue --version
          qemu-img --version
          msgfmt --version

      - name: Verify third-party sources
        run: |
          set -euo pipefail

          test -f third_party/musl/configure
          test -f third_party/busybox/Makefile
          git -C third_party/musl rev-parse --verify HEAD
          git -C third_party/busybox rev-parse --verify HEAD
          git submodule status --recursive

      - name: Prepare build configuration
        env:
          KCONFIG_INSTALLER_ROOT_SIZE_MIB: ${{ inputs.installer_root_size_mib }}
          KCONFIG_INSTALLER_INSTALLED_REQUIRE_LICENSE: ${{ inputs.installed_system_requires_license }}
          KCONFIG_LICENSE_SERVER_URL: ${{ inputs.license_server_url }}
          KCONFIG_LICENSE_DEBUG_LOG: ${{ inputs.license_debug_log }}
        run: |
          set -euo pipefail

          : "${KCONFIG_INSTALLER_ROOT_SIZE_MIB:=400}"
          : "${KCONFIG_INSTALLER_INSTALLED_REQUIRE_LICENSE:=false}"
          : "${KCONFIG_LICENSE_SERVER_URL:=http://127.0.0.1:30301}"
          : "${KCONFIG_LICENSE_DEBUG_LOG:=true}"

          config_path=out/x86_64/release/config/.config
          # Always start from the checked-in defconfig.  This also runs the
          # component/Kconfig synchronizer, so removed symbols cannot leak
          # into a fresh CI checkout from a stale workspace configuration.
          make fetch
          # kernel/reliefnt submodule cache (unifont); its cache/ is untracked
          make -C kernel/reliefnt fetch
          make defconfig

          set_config() {
            local key=$1
            local value=$2
            sed -i "/^${key}=/d;/^# ${key} is not set$/d" "$config_path"
            printf '%s=%s\n' "$key" "$value" >> "$config_path"
          }

          set_bool() {
            local key=$1
            local value=$2
            case "$value" in
              true) set_config "$key" y ;;
              false) set_config "$key" n ;;
              *) echo "invalid boolean for $key: $value" >&2; exit 1 ;;
            esac
          }

          if ! [[ "$KCONFIG_INSTALLER_ROOT_SIZE_MIB" =~ ^[0-9]+$ ]] || \
             (( KCONFIG_INSTALLER_ROOT_SIZE_MIB < 32 || KCONFIG_INSTALLER_ROOT_SIZE_MIB > 4096 )); then
            echo "installer_root_size_mib must be an integer from 32 to 4096" >&2
            exit 1
          fi
          case "$KCONFIG_LICENSE_SERVER_URL" in
            http://*|https://*) ;;
            *) echo "license_server_url must start with http:// or https://" >&2; exit 1 ;;
          esac
          if [[ "$KCONFIG_LICENSE_SERVER_URL" =~ [[:space:]\"\\\\] ]]; then
            echo "license_server_url must not contain whitespace, quotes, or backslashes" >&2
            exit 1
          fi

          set_config CONFIG_INSTALLER_ROOT_SIZE_MIB "$KCONFIG_INSTALLER_ROOT_SIZE_MIB"
          set_bool CONFIG_INSTALLER_INSTALLED_REQUIRE_LICENSE "$KCONFIG_INSTALLER_INSTALLED_REQUIRE_LICENSE"
          set_config CONFIG_LICENSE_SERVER_URL "\"$KCONFIG_LICENSE_SERVER_URL\""
          set_bool CONFIG_LICENSE_DEBUG_LOG "$KCONFIG_LICENSE_DEBUG_LOG"

      - name: Verify dynamic component configuration
        run: |
          set -euo pipefail
          make olddefconfig
          sh tests/build/test-components.sh
          sh tests/build/test-components-metadata.sh
          if make CONFIG_NOT_A_REAL_OPTION=y kernel; then
            echo "unknown CONFIG override unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Build ReliefOS images
        run: |
          set -euo pipefail

          make -j"$(nproc)" all

      - name: Verify generated images
        run: |
          set -euo pipefail

          test -s out/x86_64/release/images/reliefos.vmdk
          test -s out/x86_64/release/images/reliefos-live.iso
          test -s out/x86_64/release/images/reliefos-installer.iso
          qemu-img info out/x86_64/release/images/reliefos.vmdk

      # ---------- 新增：生成构建摘要 Markdown ----------
      - name: Generate build summary
        run: |
          cat > build-summary.md <<EOF
          # ReliefOS Build Summary

          **Run ID:** ${{ github.run_id }}
          **Run Number:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          **Ref:** ${{ github.ref }}
          **Triggered by:** ${{ github.actor }}
          **Build Date:** $(date -u)

          ## Input Parameters
          - installer_root_size_mib: ${{ inputs.installer_root_size_mib }}
          - installed_system_requires_license: ${{ inputs.installed_system_requires_license }}
          - license_server_url: ${{ inputs.license_server_url }}
          - license_debug_log: ${{ inputs.license_debug_log }}
          - upload_artifacts: ${{ inputs.upload_artifacts }}

          ## Generated Artifacts
          - reliefos.vmdk
          - reliefos-live.iso
          - reliefos-installer.iso
          - leonos.conf
          - build-summary.md (this file)

          ## Retention Policy
          Artifacts will be automatically deleted after 3 days.
          EOF

          # 同时写入 GitHub Step Summary，便于在 Actions 页面查看
          cat build-summary.md >> $GITHUB_STEP_SUMMARY

      # ---------- 修改：条件上传 + 设置保留天数 ----------
      - name: Upload ReliefOS artifacts
        if: inputs.upload_artifacts == 'true'   # 仅当用户允许上传时才执行
        uses: actions/upload-artifact@v4
        with:
          name: ReliefOS-${{ github.run_number }}
          path: |
            out/x86_64/release/images/reliefos.vmdk
            out/x86_64/release/images/reliefos-live.iso
            out/x86_64/release/images/reliefos-installer.iso
            out/x86_64/release/config/.config
            build-summary.md                       # 包含摘要文档
          if-no-files-found: error
          compression-level: 0
          retention-days: 3                        # 3天后自动删除
