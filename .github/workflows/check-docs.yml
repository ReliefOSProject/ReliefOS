name: Check documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sphinx: ['5.3.*', '7.2.6', '9.*']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout kernel documentation
        run: git submodule update --init kernel/reliefnt

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Documentation/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r Documentation/requirements.txt 'Sphinx==${{ matrix.sphinx }}'

      - name: Check both manuals and the documentation portal
        run: python tools/test_documentation.py
